[package]
name = "aiui-aix"
version = "0.7.0"
edition = "2021"
description = "Core Rust library for reading and analyzing AIX packages for AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jsar-project/aix"
homepage = "https://jsar-project.github.io/aix/"
documentation = "https://jsar-project.github.io/aix/spec"
keywords = ["aix", "ai", "agent", "package", "archive"]
categories = ["encoding", "parser-implementations"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
anyhow = { workspace = true }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }

[features]
default = ["std"]
std = ["anyhow/std", "serde/std", "serde_json/std"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen"]

name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            crates/aix-web/package-lock.json
            crates/aix-web/playground/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Install aix-web dependencies
        run: npm ci
        working-directory: crates/aix-web

      - name: Install playground dependencies
        run: npm ci
        working-directory: crates/aix-web/playground

      - name: Build aix-web package
        run: npm run build
        working-directory: crates/aix-web

      - name: Build playground
        run: npm run build
        working-directory: crates/aix-web/playground
        env:
          VITE_BASE_PATH: /aix/playground/

      - name: Build docs
        run: npm run build
        working-directory: docs
        env:
          BASE_PATH: /aix

      - name: Copy playground into docs artifact
        run: |
          mkdir -p docs/.vitepress/dist/playground
          cp -R crates/aix-web/playground/dist/. docs/.vitepress/dist/playground/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

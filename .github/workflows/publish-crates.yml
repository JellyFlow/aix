name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        default: all
        type: choice
        options:
          - aix
          - aix-cli
          - all
      dry_run:
        description: Run cargo publish --dry-run instead of publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run baseline tests
        run: cargo test -p aix -p aix-cli

      - name: Ensure crates.io token is configured
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret" >&2
            exit 1
          fi

      - name: Dry run publish aix
        if: ${{ inputs.crate == 'aix' || inputs.crate == 'all' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p aix --dry-run
          fi

      - name: Preview aix-cli package contents
        if: ${{ inputs.crate == 'aix-cli' || inputs.crate == 'all' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo package -p aix-cli --list
          fi

      - name: Publish aix
        if: ${{ (inputs.crate == 'aix' || inputs.crate == 'all') && !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p aix

      - name: Wait for crates.io index propagation
        if: ${{ inputs.crate == 'all' && !inputs.dry_run }}
        run: sleep 30

      - name: Publish aix-cli
        if: ${{ (inputs.crate == 'aix-cli' || inputs.crate == 'all') && !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p aix-cli

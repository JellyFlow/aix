name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: daily
        type: choice
        options:
          - daily
          - release
      crate:
        description: Crate to publish
        required: true
        default: all
        type: choice
        options:
          - aiui-aix
          - aiui-aix-cli
          - all
      dry_run:
        description: Run cargo publish --dry-run instead of publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Prepare daily crate versions
        if: ${{ inputs.channel == 'daily' }}
        shell: bash
        run: |
          BASE_VERSION=$(grep -m1 '^version = "' crates/aix/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          DAILY_DATE=$(date -u +%Y%m%d)
          DAILY_VERSION="${BASE_VERSION}-daily.${DAILY_DATE}"

          echo "Preparing daily versions from ${BASE_VERSION} to ${DAILY_VERSION}"

          perl -0pi -e 's/^version = "\K[^"]+/'"${DAILY_VERSION}"'/m' crates/aix/Cargo.toml
          perl -0pi -e 's/^version = "\K[^"]+/'"${DAILY_VERSION}"'/m' crates/aix-cli/Cargo.toml
          perl -0pi -e 's/(package = "aiui-aix", path = "\.\.\/aix", version = ")[^"]+/\1'"${DAILY_VERSION}"'/' crates/aix-cli/Cargo.toml

          echo "Resolved daily version: ${DAILY_VERSION}"

      - name: Run baseline tests
        run: cargo test -p aiui-aix -p aiui-aix-cli

      - name: Ensure crates.io token is configured
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret" >&2
            exit 1
          fi

      - name: Dry run publish aiui-aix
        if: ${{ inputs.crate == 'aiui-aix' || inputs.crate == 'all' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p aiui-aix --dry-run
          fi

      - name: Preview aiui-aix-cli package contents
        if: ${{ inputs.crate == 'aiui-aix-cli' || inputs.crate == 'all' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo package -p aiui-aix-cli --list
          fi

      - name: Publish aiui-aix
        if: ${{ (inputs.crate == 'aiui-aix' || inputs.crate == 'all') && !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p aiui-aix

      - name: Wait for crates.io index propagation
        if: ${{ inputs.crate == 'all' && !inputs.dry_run }}
        run: sleep 30

      - name: Publish aiui-aix-cli
        if: ${{ (inputs.crate == 'aiui-aix-cli' || inputs.crate == 'all') && !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p aiui-aix-cli
